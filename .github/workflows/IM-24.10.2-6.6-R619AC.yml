name: IM-24.10-6.6-R619AC

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 50 00 * * MON

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master  # 若需切换 24.10 分支，直接改为 openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: r619im-6.6-3.config
  DIY_P0_SH: r619im-part0.sh
  DIY_P1_SH: r619im-part1.sh
  DIY_P2_SH: r619im-part2.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FIRMWARE_TAG: R619AC
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 用于上传 Release，避免权限不足

    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 查看当前目录空间
        df -hT $PWD               
        # 替换 apt-get -qq 为正常输出，避免隐藏错误
        sudo -E apt-get update -y
        # 执行 ImmortalWrt 官方依赖脚本（保留输出，便于排查失败）
        sudo bash -c 'bash <(curl https://build-scripts.immortalwrt.org/init_build_environment.sh)' || {
          echo "ERROR: 依赖安装脚本执行失败！"
          exit 1
        }
        # 补充 kernel-headers 编译必需依赖（ImmortalWrt 脚本可能遗漏）
        sudo -E apt-get install -y --no-install-recommends \
          libiberty-dev libpci-dev libudev-dev python3-pip
        # 清理缓存，释放空间
        sudo -E apt-get autoremove --purge -y
        sudo -E apt-get clean
        # 设置时区
        sudo timedatectl set-timezone "$TZ"
        # 递归授权工作目录（避免子目录权限问题）
        sudo mkdir -p /mnt/workdir
        sudo chown -R $USER:$GROUPS /mnt/workdir
        sudo chmod 755 /mnt/workdir
        # 验证核心依赖是否安装成功
        echo "=== 核心依赖验证 ==="
        gcc --version || { echo "GCC 未安装！"; exit 1; }
        make --version || { echo "Make 未安装！"; exit 1; }
        python3 --version || { echo "Python3 未安装！"; exit 1; }

    - name: Maximize disk space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 4096  # 增大交换分区（避免编译时内存不足）
        temp-reserve-mb: 500  # 保留临时目录空间
        root-reserve-mb: 2048  # 保留根目录空间（避免空间耗尽）
        remove-dotnet: true  # 移除无用的 .NET（释放 ~2GB 空间）
        remove-android: true  # 移除无用的 Android 工具（释放空间）

    - name: Checkout custom configs/scripts
      uses: actions/checkout@main
      with:
        path: custom  # 把用户的 config/脚本 检出到 custom 目录，避免与源码冲突

    - name: Clone ImmortalWrt source code
      run: |
        # 查看工作目录空间
        df -hT $GITHUB_WORKSPACE
        # 克隆源码并更新子模块（避免源码缺失）
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive  # 关键：拉取子模块（如工具链依赖）
        # 输出源码信息到环境变量
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        COMMIT_AUTHOR=$(git show -s --date=short --format="Commit Author: %an")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        COMMIT_DATE=$(git show -s --date=short --format="Commit Timestap: %ci")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        COMMIT_MESSAGE=$(git show -s --date=short --format="Commit Message: %s")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        COMMIT_HASH=$(git show -s --date=short --format="Hash: %H")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

    - name: Generate build variables
      run: |
        # 复制用户配置文件到源码目录
        cp custom/$CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        # 提取设备信息
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep -m1 "CONFIG_TARGET_BOARD" .config | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(grep -m1 "CONFIG_TARGET_SUBTARGET" .config | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        DEVICE_ARCH=$(grep -m1 "CONFIG_TARGET_ARCH_PACKAGES" .config | awk -F '"' '{print $2}')
        echo "DEVICE_ARCH=$DEVICE_ARCH" >> $GITHUB_ENV
        # 验证配置文件有效性
        if ! grep -q "CONFIG_LINUX_VERSION" .config; then
          echo "ERROR: 配置文件无效，未找到内核版本信息！"
          exit 1
        fi
        echo "内核版本: $(grep "CONFIG_LINUX_VERSION" .config | awk -F '"' '{print $2}')"

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: true
        mixkey: r619-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Load custom feeds & run DIY script 0
      run: |
        cd $OPENWRT_PATH
        # 复制自定义 feeds.conf（若存在）
        [ -f custom/$FEEDS_CONF ] && cp custom/$FEEDS_CONF feeds.conf.default
        # 执行 DIY_P0_SH（先检查脚本是否存在且可执行）
        if [ -f custom/$DIY_P0_SH ]; then
          chmod +x custom/$DIY_P0_SH
          custom/$DIY_P0_SH || { echo "DIY_P0_SH 执行失败！"; exit 1; }
        else
          echo "警告：未找到 $DIY_P0_SH，跳过该步骤"
        fi
        # 创建自定义文件目录并复制文件（避免目录不存在报错）
        mkdir -p files/etc/{config,smartdns,opkg,crontabs,mydns}
        SRC_DIR="custom/r619ac/etc"
        if [ -d $SRC_DIR ]; then
          cp -rfv $SRC_DIR/* files/etc/
        else
          echo "警告：未找到 $SRC_DIR，跳过文件复制"
        fi
        # 确保脚本权限
        chmod 755 files/etc/updatew.sh 2>/dev/null || true
        chmod 755 files/etc/mosdns/script/flush_cache.sh 2>/dev/null || true
        chmod 755 files/etc/init.d/cert_bootstrap 2>/dev/null || true

    - name: Update feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a || { echo "Feeds 更新失败！"; exit 1; }

    - name: Run DIY script 1 before install feeds
      run: |
        cd $OPENWRT_PATH
        if [ -f custom/$DIY_P1_SH ]; then
          chmod +x custom/$DIY_P1_SH
          custom/$DIY_P1_SH || { echo "DIY_P1_SH 执行失败！"; exit 1; }
        else
          echo "警告：未找到 $DIY_P1_SH，跳过该步骤"
        fi

    - name: Install feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds install -a || { echo "Feeds 安装失败！"; exit 1; }

    - name: Load custom config & run DIY script 2
      run: |
        cd $OPENWRT_PATH
        # 复制自定义文件（若存在）
        [ -d custom/files ] && cp -rf custom/files/* files/
        # 重新加载配置文件（覆盖可能被 feeds 修改的配置）
        cp custom/$CONFIG_FILE .config
        # 执行 DIY_P2_SH
        if [ -f custom/$DIY_P2_SH ]; then
          chmod +x custom/$DIY_P2_SH
          custom/$DIY_P2_SH || { echo "DIY_P2_SH 执行失败！"; exit 1; }
        else
          echo "警告：未找到 $DIY_P2_SH，跳过该步骤"
        fi
        # 生成最终配置（确保配置生效）
        make defconfig || { echo "生成配置失败！"; exit 1; }

    - name: Download packages (with integrity check)
      id: package
      run: |
        cd $OPENWRT_PATH
        # 多线程下载包（加快速度）
        make download -j$(nproc) || { echo "包下载失败！"; exit 1; }
        # 检查并删除小于 1KB 的损坏包（避免编译时出错）
        BROKEN_FILES=$(find dl -size -1024c)
        if [ -n "$BROKEN_FILES" ]; then
          echo "发现损坏的下载包："
          ls -l $BROKEN_FILES
          rm -f $BROKEN_FILES
          echo "已删除损坏包，重新尝试下载..."
          make download -j$(nproc) || { echo "重新下载失败！"; exit 1; }
        fi
        echo "包下载完成，无损坏文件"

    - name: Compile firmware (with fallback to verbose log)
      id: compile
      run: |
        cd $OPENWRT_PATH
        CPU_CORES=$(nproc)
        echo "使用 $CPU_CORES+1 线程编译..."
        # 先尝试多线程编译，失败则单线程+详细日志（便于排查）
        make -j $((CPU_CORES+1)) world || {
          echo "多线程编译失败，切换到单线程详细日志模式..."
          make -j1 V=s world  # 关键：失败后输出详细日志，定位 kernel-headers 问题
        }
        # 编译成功后提取设备名称
        echo "status=success" >> $GITHUB_OUTPUT
        DEVICE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | head -n1)
        [ -n "$DEVICE_NAME" ] && echo "DEVICE_NAME=_$DEVICE_NAME" >> $GITHUB_ENV || echo "DEVICE_NAME=_Unknown" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin
        retention-days: 3  # 保留 3 天，节省存储空间

    - name: Organize firmware files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd ${{ env.OPENWRT_PATH }}/bin/targets/*/*
        rm -rf packages  # 移除冗余的 packages 目录，减小上传体积
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        # 输出固件列表
        echo "生成的固件文件："
        ls -lh

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7  # 固件保留 7 天

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        RELEASE_TAG="IM-${{ env.REPO_BRANCH }}-${{ env.FIRMWARE_TAG }}$(date +"%Y.%m.%d-%H%M")"
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        # 生成 Release 描述
        cat > release.txt << EOF
        ## 📦 ImmortalWrt Firmware for ${{ env.FIRMWARE_TAG }}
        ### 🔧 固件信息
        - 架构：${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.DEVICE_ARCH }}
        - 源码：[${{ env.REPO_URL }}/tree/${{ env.REPO_BRANCH }}](${{ env.REPO_URL }}/tree/${{ env.REPO_BRANCH }})
        - 分支：${{ env.REPO_BRANCH }}
        - 内核：$(grep "CONFIG_LINUX_VERSION" ${{ env.OPENWRT_PATH }}/.config | awk -F '"' '{print $2}')
        - 默认地址：192.168.1.1
        - 默认账号：root/password
        
        ### 📝 源码提交信息
        - ${{ env.COMMIT_AUTHOR }}
        - ${{ env.COMMIT_DATE }}
        - ${{ env.COMMIT_MESSAGE }}
        - ${{ env.COMMIT_HASH }}
        
        ### ⚠️ 注意
        1. 首次刷机请备份原配置
        2. 若需保留配置，刷机时选择 "保留配置"（风险自担）
        3. 插件功能请自行测试，不适配请反馈
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.r619_ACT }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
        body_path: release.txt
        draft: false
        prerelease: false

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 4
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}