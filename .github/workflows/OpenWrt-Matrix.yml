# Reusable workflow for building OpenWrt firmware
name: OpenWrt-Matrix

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
        default: ""
      upload_source:
        required: false
        type: boolean
        default: false
      build_firmware:
        required: false
        type: boolean
        default: true

  workflow_dispatch:
    inputs:
      targets:
        description: "Select target platforms (comma separated, e.g. X86 ;leave blank for all, case-insensitive)"
        required: false
        type: string
        default: ""
      upload_source:
        description: "Upload source folder before build"
        required: false
        type: boolean
        default: false
      build_firmware:
        description: "Build and publish firmware"
        required: false
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - id: set-matrix
        shell: bash
        run: |
          # All possible targets (only X86 retained)
          all_targets='[
            {"name": "X86", "script_dir": "X86", "arch": "x86/64", "arch_suffix": ""}
          ]'

          # User selected targets
          inputs_targets="${{ inputs.targets }}"
          # Replace Chinese comma with English comma, convert to uppercase, trim spaces
          inputs_targets=$(echo "$inputs_targets" | sed 's/，/,/g' | tr 'a-z' 'A-Z' | xargs)

          if [[ -z "$inputs_targets" ]]; then
            # Use all targets if input is empty
            echo "matrix=$(echo "$all_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          else
            # Filter targets based on user input
            filtered_targets=$(echo "$all_targets" | jq --arg targets "$inputs_targets" '[.[] | select(.name as $name | ($targets | split(",") | map(gsub(" "; "")) | index($name))) ]')
            echo "matrix=$(echo "$filtered_targets" | jq -c '{include: .}')" >> $GITHUB_OUTPUT
          fi
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build:
    needs: setup
    env: # default values, will be overridden later
      seed: dummy
      artifact_prefix: dummy
      sha_match: dummy
      ext4_zip: dummy
      sfs_zip: dummy
      sysupgrade_glob: dummy
      openwrt_source_name: dummy
      TARGET_DEVICE_ARCH: dummy
      latest_release: dummy

    runs-on: ubuntu-24.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Generate platform variables and print
        id: genvars
        run: |
          # Debug: Print all input variables
          echo "inputs.targets: '${{ inputs.targets }}'"
          echo "inputs.upload_source: '${{ inputs.upload_source }}'"
          echo "inputs.build_firmware: '${{ inputs.build_firmware }}'"
          echo "matrix.name: '${{ matrix.name }}'"
          echo "matrix.script_dir: '${{ matrix.script_dir }}'"
          echo "matrix.arch: '${{ matrix.arch }}'"
          echo "matrix.arch_suffix: '${{ matrix.arch_suffix }}'"
          echo "github.run_id: '${{ github.run_id }}'"

          # Platform name in lowercase
          name_lower=$(echo "${{ matrix.name }}" | tr 'A-Z' 'a-z')

          # seed rule
          seed="${{ matrix.name }}"

          # artifact_prefix rule
          artifact_prefix="${{ matrix.name }}-Openwrt"

          # sha_match rule
          sha_match="$name_lower"

          # ext4_zip/sfs_zip rule (only X86 now, can simplify)
          ext4_zip='*ext4-combined*'
          sfs_zip='*squashfs-combined*'
          sysupgrade_glob='*combined-efi.img*'

          # workerid variable
          workerid=${{ github.run_id }}

          # openwrt_source_name archive name
          openwrt_source_name="openwrt-source-${{ matrix.name }}-${workerid}.tar"

          cat <<EOF | tee -a $GITHUB_ENV
          seed=$seed
          artifact_prefix=$artifact_prefix
          sha_match=$sha_match
          ext4_zip=$ext4_zip
          sfs_zip=$sfs_zip
          sysupgrade_glob=$sysupgrade_glob
          openwrt_source_name=$openwrt_source_name
          EOF

      - name: Show system info
        run: |
          echo -e "Total CPU cores\t: $(nproc)"
          cat /proc/cpuinfo | grep 'model name' | head -n 1

      - name: Maximize build space
        if: inputs.build_firmware
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 512
          root-reserve-mb: 4608
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout
        uses: actions/checkout@main

      - name: Init build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo /bin/bash -c "$(curl -sL https://git.io/vokNn)"
          sudo -E apt-fast -y -qq install asciidoc bash bcc bin86 binutils bison bzip2 clang file flex g++ g++-multilib gawk gcc-multilib gettext git gzip help2man intltool libbpf-dev libboost-dev libelf-dev libncurses-dev libssl-dev libthread-queue-any-perl libusb-dev libxml-parser-perl linux-tools-generic llvm make patch perl-modules pkg-config python3-dev python3-pip python3-pyelftools python3-setuptools rsync sharutils swig time unzip util-linux wget xsltproc zlib1g-dev zip zstd
          sudo -E apt-fast -y -qq install dos2unix dwarves jq npm quilt
          sudo -E npm install -g pnpm
          sudo -E npm install -g n
          sudo -E n stable
          pip3 install --user -U pylibfdt --break-system-packages
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo -E git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
          sudo -E git config --global core.abbrev auto
          df -h

      - name: Prepare Mixedwrt
        run: |
          # Fix: Replace hardcoded path with github.workspace, add directory existence check
          TARGET_DIR="${{ github.workspace }}"
          if [ -d "$TARGET_DIR" ]; then
            sudo chown -R runner:runner "$TARGET_DIR"
          fi
          # Ensure SCRIPTS directory exists before copy
          if [ -d "./SCRIPTS/${{ matrix.script_dir }}" ]; then
            cp -r ./SCRIPTS/${{ matrix.script_dir }}/. ./SCRIPTS/
          fi
          cp -r ./SCRIPTS/. ./ || true
          /bin/bash 01_get_ready.sh || echo "Warning: 01_get_ready.sh execution returned non-zero code"

      - name: Prepare Package
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cp -r ../SCRIPTS/. ./ || true
          /bin/bash 02_prepare_package.sh || true
          /bin/bash 02_target_only.sh || true
          /bin/bash 04_remove_upx.sh || true

      - name: QTMDFW4
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          mkdir -p ../SEED/${{ env.seed }} # Ensure seed directory exists
          cp -rf ../SEED/${{ env.seed }}/config.seed .config || true

      - name: Convert Translation
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 03_convert_translation.sh || true

      - name: Add ACL
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          /bin/bash 05_create_acl_for_luci.sh -a || true

      - name: Fix Permissions
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          sudo -E chmod -R 755 ./08_fix_permissions.sh || true
          /bin/bash 08_fix_permissions.sh || true
          chmod 755 ./files/etc/updatew.sh || true
          chmod 755 ./files/etc/mosdns/script/flush_cache.sh || true
          chmod 755 ./files/etc/init.d/cert_bootstrap || true

      - name: Make Config
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          make defconfig || true

      - name: Get Architecture
        id: getarch
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          # Get TARGET_DEVICE_ARCH with fault tolerance
          TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
          if [ -n "${{ matrix.arch_suffix }}" ]; then
            TARGET_DEVICE_ARCH="$TARGET_DEVICE_ARCH-${{ matrix.arch_suffix }}"
          fi
          # Default value if TARGET_DEVICE_ARCH is empty
          TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH:-x86}
          echo "TARGET_DEVICE_ARCH=$TARGET_DEVICE_ARCH" >> $GITHUB_ENV

          # Optimize: Add fault tolerance for latest_release acquisition
          latest_release="$(curl -s --connect-timeout 10 https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
          # Default tag if acquisition fails
          latest_release=${latest_release:-25.12.0-rc1}
          # Add v prefix (Git tag best practice) to avoid tag_name invalid
          latest_release="v${latest_release}"
          echo "latest_release=${latest_release}" >> $GITHUB_ENV

          echo "Package folder ${{ env.openwrt_source_name }}"
          cd ..
          # Must use tar, otherwise symbolic links will be incomplete
          if [ "${{ inputs.upload_source }}" = "true" ]; then
            tar -cf ${{ env.openwrt_source_name }} openwrt || true
          fi

      # upload_source
      - name: Upload Source Archive
        if: inputs.upload_source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.openwrt_source_name }}
          path: |
            ${{ env.openwrt_source_name }}
          retention-days: 5

      - name: Cache
        if: inputs.build_firmware
        uses: HiGarfield/cachewrtbuild@main
        with:
          mixkey: ${{ env.TARGET_DEVICE_ARCH }}
          prefix: ${{ github.workspace }}/openwrt
          skip_saving: ${{ !inputs.build_firmware }}

      - name: Make Download
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          if [ "${{ inputs.upload_source }}" = "true" ] && [ -f ../${{ env.openwrt_source_name }} ]; then
            rm ../${{ env.openwrt_source_name }}
          fi
          make download -j50 || true
          make -j$(($(nproc) + 1)) package/network/utils/nftables/refresh V=s || true

      # build_firmware
      - name: Compile Openwrt
        if: inputs.build_firmware
        working-directory: ${{ github.workspace }}/openwrt
        id: compileopenwrt
        continue-on-error: true
        run: |
          IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
          echo $?

      - name: If Error
        if: steps.compileopenwrt.outcome == 'failure'
        working-directory: ${{ github.workspace }}/openwrt
        run: |
          cat ./.config
          echo '================================================================'
          make -j1 V=s

      - name: Organize files
        if: inputs.build_firmware
        id: organize
        env:
          LATEST_RELEASE: ${{ env.latest_release }}
        run: |
          rm -rf ./artifact/
          mkdir -p ./artifact/
          # Add fault tolerance for file movement
          mv openwrt/bin/targets/${{ matrix.arch }}/${{ env.sysupgrade_glob }} ./artifact/ || echo "Warning: No sysupgrade files found"
          cd ./artifact/
          ls -Ahl
          gzip -d *.gz || true
          gzip --best *.img || true
          ls -Ahl
          # Avoid empty sha256sum file
          if ls openwrt*${{ env.sha_match }}* 1> /dev/null 2>&1; then
            sha256sum openwrt*${{ env.sha_match }}* | tee ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}.sha256sum
          fi
          # Avoid zip command failure when no matching files
          ls ${{ env.ext4_zip }} 1> /dev/null 2>&1 && zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-ext4.zip ${{ env.ext4_zip }} || true
          ls ${{ env.sfs_zip }} 1> /dev/null 2>&1 && zip ${{ env.artifact_prefix }}-$(date +%Y-%m-%d)-${{ env.latest_release }}-sfs.zip ${{ env.sfs_zip }} || true
          ls -Ahl

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}


      - name: Create release
        if: inputs.build_firmware
        id: create_release
        uses: ncipollo/release-action@main
        with:
          name: OpenWRT-${{ env.latest_release }}
          allowUpdates: true
          prerelease: false
          tag: ${{ env.latest_release }} # Use optimized latest_release with v prefix
          commit: main # Core fix: Replace invalid 25.12 with legal branch name
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ./artifact/*.zip # Ensure zip files exist (with fault tolerance above)

      - name: Print Disk Space After
        run: df -h

      - name: Trigger badge sync for current platform
        if: github.workflow == 'OpenWrt-Matrix' && inputs.build_firmware && steps.create_release.outcome != 'skipped' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering badge sync for ${{ matrix.name }} with status: ${{ steps.create_release.outcome }}"
          gh workflow run "${{ matrix.name }}-OpenWrt.yml" \
            --field badge_status="${{ steps.create_release.outcome }}" || echo "Failed to trigger ${{ matrix.name }} workflow"