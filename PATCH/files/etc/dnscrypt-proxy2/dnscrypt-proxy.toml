###############################
## DNScrypt-Proxy 2 优化配置 ##
## 核心目标：防止DNS泄露     ##
###############################

# ========== 服务器选择与协议 ==========
# 取消注释并明确指定对代理友好、可靠的服务器
server_names = ['yandex', 'doh.opendns.com']

# 监听地址（供本地客户端或MosDNS使用）
listen_addresses = ['127.0.0.1:5353']
max_clients = 250

# 协议支持
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false  # 推荐使用更现代的DoH
doh_servers = true
odoh_servers = false       # 可选，通常不需要

# ========== 代理设置 (防泄露关键) ==========
# ** 必须启用，使所有DNS查询通过您的代理隧道出境 **
proxy = 'socks5://127.0.0.1:7898'
force_tcp = true
# http3 = false            # 如代理支持可尝试开启

# ========== 服务器与安全要求 ==========
# 初始阶段放宽要求，确保至少有一个服务器可用
require_dnssec = true
require_nolog = false      # 连通后可尝试改为 true
require_nofilter = false   # 连通后可尝试改为 true
disabled_server_names = []

# ========== 超时与网络设置 ==========
timeout = 15000           # 略微增加超时时间
keepalive = 30
cert_refresh_delay = 240

# ** 引导解析器必须使用国内DNS **
bootstrap_resolvers = ['119.29.29.29:53', '223.5.5.5:53']
ignore_system_dns = true

# 网络探测
netprobe_timeout = 30
netprobe_address = '119.29.29.29:53'

# ========== 日志与过滤设置 ==========
log_files_max_size = 10
log_files_max_age = 7
log_files_max_backups = 1

# 过滤
block_ipv6 = true
block_unqualified = true
block_undelegated = true
reject_ttl = 300

# ** 关键：建议注释转发规则，避免特定域名被定向到国内DNS **
# forwarding_rules = '/etc/dnscrypt-proxy2/dnscrypt-forwarding-rules.txt'
# cloaking_rules = '/etc/dnscrypt-proxy2/dnscrypt-cloaking-rules.txt'
cloak_ttl = 3600
cloak_ptr = false

# ========== 缓存优化 ==========
cache = true
cache_size = 4096          # 平衡速度与内存
cache_min_ttl = 600
cache_max_ttl = 3600
cache_neg_min_ttl = 30
cache_neg_max_ttl = 300

# ========== 本地 DoH 服务 (供MosDNS使用) ==========
[local_doh]
listen_addresses = ['127.0.0.1:7058']
path = '/dns-query'
cert_file = '/etc/dnscrypt-proxy2/mosdns-cert.pem'
cert_key_file = '/etc/dnscrypt-proxy2/mosdns-key.pem'
# 将您的自签名证书追加到系统 CA 捆绑包末尾
# cat /etc/dnscrypt-proxy2/smartdns-cert.pem >> /etc/ssl/certs/ca-certificates.crt,ln -sf /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem
# openssl s_client -connect 127.0.0.1:7058 -servername smartdns -CAfile /etc/ssl/certs/ca-certificates.crt，/etc/init.d/dnscrypt-proxy restart

# ========== 日志文件配置 ==========
[query_log]
  file = '/var/log/dnscrypt-query.log'
  format = 'tsv'
  ignored_qtypes = ['DNSKEY', 'NS', 'OPT']

[nx_log]
  file = '/var/log/dnscrypt-nxdomain.log'
  format = 'tsv'

# ========== 源列表更新设置 ==========
[sources]
  [sources.public-resolvers]
    urls = ['https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md', 'https://ghfast.top/https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md']
    cache_file = 'public-resolvers.md'
    minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
    refresh_delay = 72
    prefix = ''

# ========== 高级功能 (建议暂时禁用以保证稳定性) ==========
# ** 匿名DNS可能增加延迟和不确定性，建议先注释 **
# [anonymized_dns]
# routes = [
#    { server_name = '*', via = ['anon-cs-singapore'] }
# ]
# skip_incompatible = true
# direct_cert_fallback = false

# ** 以下部分通常保持默认即可，如有特殊需求再启用 **
